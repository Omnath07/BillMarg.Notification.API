name: FTP Deploy (Production)

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore BillMarg.Notification.API/BillMarg.Notification.API.csproj

      - name: Build project
        run: dotnet build BillMarg.Notification.API/BillMarg.Notification.API.csproj \
          --configuration Release \
          --no-restore

      - name: Publish project
        run: dotnet publish BillMarg.Notification.API/BillMarg.Notification.API.csproj \
          --configuration Release \
          --no-restore \
          --output ./publish

      - name: Show published files
        run: |
          echo "========== PUBLISHED FILES =========="
          find ./publish -maxdepth 2 -type f | sort
          echo "===================================="

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.FTP_SERVER_NOTIFY_PROD }}
          username: ${{ secrets.FTP_USERNAME_NOTIFY_PROD }}
          password: ${{ secrets.FTP_PASSWORD_NOTIFY_PROD }}

          protocol: ftp
          port: 21

          server-dir: /
          local-dir: ./publish/

          log-level: verbose

          exclude: |
            .git*
            .github/**
            *.tmp
            *.md

          dangerous-clean-slate: false
